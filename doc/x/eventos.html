    <script>
        // propagacion de eventos
        boton.addEventListener("click", (ev) => {
            alert("soy el boton");
            ev.stopPropagation();
            // ev.stopImmediatePropagation();
            let ev1 = new Event("click");
            document.getElementsByTagName("div")[0].dispatchEvent(ev1)
        });
        document.getElementsByTagName("p")[0].addEventListener("click", () => {
            alert("soy el p")
        });
        document.getElementsByTagName("div")[0].addEventListener("click", () => {
            alert("soy el div")
        });
        boton.addEventListener("contextmenu", (ev) => {
            ev.preventDefault()
            // alert("brrr")
        });
    </script>
