<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./index.js" defer></script>
    <title>Document</title>
    <style>
        * {box-sizing: border-box;}
        body {margin: 0; padding: 0;}
        #listaUsuarios {
            --separacion: 12px;
            padding: var(--separacion);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--separacion);
        }
        #listaUsuarios > div {
            width: 100%; height: 100%;
            justify-items: center;
            min-height: 250px;
            max-height: 500px;
            background-color: beige;
            border-radius: .5rem;
            border: 3px solid darkslateblue;
            padding: 8px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            & > * { margin: 0; padding: 0; }
        }
        #listaUsuarios> div > img {
            width: 40%;
            border-radius: 15%;
            border: 1px solid black;
        }
        #listaUsuarios> div > {}

        #contador {
            position: fixed;
            bottom: 20px;
            left: 50%;
            background: black;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>
    <p id="contador">0</p>
    <main id="listaUsuarios">
    </main>
</body>
</html>
